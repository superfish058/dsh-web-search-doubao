# web-search-doubao bundle overlay.
#
# Mounted by `dsh plugin add` on install. Two things happen:
#   1. The Doubao Search (Volcengine 豆包搜索) provider is registered into ctx.web.
#   2. It becomes the active searchProvider, overriding the base bundle's
#      deepseek-official default.
#
# The provider reads $DOUBAO_SEARCH_API_KEY from the managed credentials store
# ($DSH_HOME/.credentials.yaml), the inherited environment, or a literal apiKey
# in the web-search-doubao settings section. All fields are runtime-configurable
# via the Settings GUI.
#
# Patch the web plugin's config to select the Doubao provider.
- id: web
  config:
    searchProvider: doubao

# Insert the Doubao Search provider plugin into the entry tree.
# Uses `insert` (not a plain id+name row) because this is a patch overlay
# applied over the base bundle's tree — a plain row would be treated as a
# config patch on a non-existent entry and silently skipped.
- insert:
    - id: web-search-doubao
      name: 'dsh-web-search-doubao'
